    <style>
        /* Theme token contract. Every shell that shares css/mapper.css must
           define this whole set - the stylesheet holds no brand literals.
           The *-rgb tokens exist because rgba() cannot take a hex var():
           rgba(var(--primary-rgb),0.4) resolves to an rgba() with real channels. */
        :root{
            /* Personal red/black brand */
            --primary:#ff3b3b;--primary-rgb:255,59,59;--primary-deep:#cc0000;
            --secondary:#ff6b6b;--secondary-rgb:255,107,107;
            --accent:#cc0000;
            --dark:#0a0a0a;--dark-rgb:10,10,10;
            --darker:#050505;--darker-rgb:5,5,5;
            --grey:#1a1a1a;--grey-light:#2d2d2d;
            --text:#e4e4e7;--text-secondary:#a1a1a1;--text-muted:#666;
            --font-body:'Outfit',sans-serif;

            /* Brand-independent */
            --glass:rgba(255,255,255,0.03);--glass-border:rgba(255,255,255,0.08);
            --green:#22c55e;--yellow:#eab308;--orange:#f97316;--red-soft:#ef4444;
            --accent-purple:#c084fc;
            --conn-vpn:#d4a017;--conn-vpn-rgb:212,160,23;
        }
    </style>
</head>
