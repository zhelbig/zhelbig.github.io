<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i-Tech Network Mapping Tool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/mapper.css">
    <style>
        /* Theme token contract. Every shell that shares css/mapper.css must
           define this whole set - the stylesheet holds no brand literals.
           The *-rgb tokens exist because rgba() cannot take a hex var():
           rgba(var(--primary-rgb),0.4) resolves to an rgba() with real channels. */
        :root{
            /* i-Tech brand */
            --primary:#0F71F0;--primary-rgb:15,113,240;--primary-deep:#006CFF;
            --secondary:#199FFF;--secondary-rgb:25,159,255;
            --accent:#EF7225;
            --dark:#001543;--dark-rgb:0,21,67;
            --darker:#001E62;--darker-rgb:0,30,98;
            --grey:#42486A;--grey-light:#4a5080;
            --text:#EAEAEA;--text-secondary:#D8D7DF;--text-muted:#8a8daf;
            --font-body:'Poppins',sans-serif;

            /* Brand-independent */
            --glass:rgba(255,255,255,0.05);--glass-border:rgba(255,255,255,0.1);
            --green:#22c55e;--yellow:#eab308;--orange:#EF7225;--red-soft:#ef4444;
            --accent-purple:#c084fc;
            --conn-vpn:#d4a017;--conn-vpn-rgb:212,160,23;
        }
    </style>
</head>
<body>
    <template id="brand-logo">
            <div class="logo">
                <div class="logo-icon logo-icon-plate">
                    <img src="i-Tech Support Logo - small.jpg" alt="i-tech logo" />
                </div>
                <span class="logo-tool-name">Network Mapping Tool</span>
            </div>
    </template>
    <div id="app-root"></div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
